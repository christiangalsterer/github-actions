name: 'Continuous Integration'

on:
  workflow_call:

permissions:
  contents: read    

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install apm 
        uses: microsoft/apm-action@v1
        with:
          apm-version: 'latest'  
      - name: Run apm audit
        run: apm audit --ci --no-cache --no-policy --no-fail-fast --no-drift 
      
      - name: Run skillscheck
        run: uvx skillscheck ./skills
      
      - name: Run skills-ref validate
        run: |
          failed=0
          for skill in ./skills/*/; do
            uvx --from "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref" skills-ref validate "$skill" || failed=1
          done
          exit $failed
      - name: Run skillspector
        run: uvx --from git+https://github.com/NVIDIA/skillspector.git skillspector scan ./skills/ --no-llm
